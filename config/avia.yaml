common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  # LiDAR -> IMU body.
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # LiDAR -> camera: active HKU415 calibration from the source file.
  Rcl: [-0.0101308, -0.999825, -0.0157522,
        -0.00937534, 0.0158473, -0.99983,
        0.999905, -0.00998136, -0.00953425]
  Pcl: [0.000920561, 0.0328817, -0.0569224]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.11
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5
  gyr_cov: 0.3
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100000
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  plot_tracked_points: false
  blind_rgb_points: 0.0

evo:
  seq_name: "CMRNext_HKU415"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  type: 1 # 0: World Frame, 1: Body Frame;
  colmap_output_en: true # need to set interval = -1
  filter_size_pcd: 0.10
  interval: 1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: true
  interval: 1
